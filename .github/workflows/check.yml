name: Check Resource Portals

on:
  workflow_dispatch: # 允許手動點按鈕觸發

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝依賴套件
        run: pip install requests

      - name: 執行連結檢驗
        run: python check_urls.py
